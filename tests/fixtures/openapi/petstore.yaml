openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      responses:
        '201':
          description: Created
          content:
            application/json:
              example: { id: 7, name: Rex }
  /pets/{petId}:
    get:
      responses:
        '200':
          description: One pet
          content:
            application/json:
              examples:
                rex:
                  $ref: '#/components/examples/Rex'
    delete:
      responses:
        '204':
          description: Deleted
  /pets/{pet-id}/photo.{ext}:
    get:
      responses:
        default:
          description: Photo info
          content:
            text/plain:
              example: a photo
  /health:
    get:
      responses:
        '500':
          description: Only errors here
  /download:
    get:
      responses:
        '200':
          description: Binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  examples:
    Rex:
      value: { id: 1, name: Rex, tag: dog }
  schemas:
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
            born: { type: string, format: date-time }
            owner: { $ref: '#/components/schemas/Owner' }
    NewPet:
      type: object
      properties:
        name: { type: string, example: Fido }
        status: { type: string, enum: [available, sold] }
    Owner:
      type: object
      properties:
        email: { type: string, format: email }
        pets:
          type: array
          items: { $ref: '#/components/schemas/Pet' }
